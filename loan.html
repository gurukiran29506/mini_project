<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Details - Installment Schedule Generator</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">
        <a href="dashboard.html" style="color: white; text-decoration: none;">Installment Generator</a>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard & Calculator</a>
        <a href="loan.html" style="font-weight: bold; color: #ffffff;">Loan Details</a>
        <a href="schedule.html">Schedule</a>
        <a href="report.html">Reports</a>
    </nav>
</header>

<div class="form-container">

    <div class="form-box">

        <h1>Enter Loan Details</h1>
        <p style="text-align: center; color: #64748b; margin-top: -15px; margin-bottom: 25px; font-size: 14px;">
            Calculate installment repayment schedules using the standard reducing-balance EMI formula
        </p>

        <!-- Quick Sample Preload for Convenience -->
        <div style="background: #f1f5f9; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-size: 13px; display: flex; justify-content: space-between; align-items: center;">
            <span>💡 <strong>SRS Demo Case:</strong> ₹1,00,000, 10% rate, 12 months</span>
            <button type="button" id="fillDemoBtn" style="background: #e2e8f0; border: 1px solid #cbd5e1; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;">Fill Demo Values</button>
        </div>

        <form id="loanForm">

            <label for="principal">
                Principal Loan Amount (₹)
            </label>
            <input
                type="number"
                id="principal"
                min="1"
                step="any"
                placeholder="e.g. 100000"
                required
            >

            <label for="interest">
                Annual Interest Rate (%)
            </label>
            <input
                type="number"
                id="interest"
                min="0"
                step="0.01"
                placeholder="e.g. 10.0"
                required
            >

            <label for="tenure">
                Loan Tenure (Months)
            </label>
            <input
                type="number"
                id="tenure"
                min="1"
                placeholder="e.g. 12"
                required
            >

            <label for="frequency">
                Installment Frequency
            </label>
            <select id="frequency" required>
                <option value="monthly" selected>Monthly</option>
                <option value="weekly">Weekly</option>
                <option value="quarterly">Quarterly</option>
                <option value="yearly">Yearly</option>
            </select>

            <label for="startDate">
                Starting Date
            </label>
            <input
                type="date"
                id="startDate"
                required
            >

            <button type="submit" class="btn" style="margin-top: 30px;">
                Generate Schedule
            </button>

        </form>

    </div>

</div>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/loan.js"></script>
<script>
    document.getElementById("fillDemoBtn").addEventListener("click", function() {
        document.getElementById("principal").value = "100000";
        document.getElementById("interest").value = "10";
        document.getElementById("tenure").value = "12";
        document.getElementById("frequency").value = "monthly";
        document.getElementById("startDate").value = "2026-11-01";
    });
</script>

</body>
</html>
