<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Installment Schedule Generator</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h2>Login</h2>

            <p id="loginMessage"></p>

            <form id="loginForm">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="submit"
                    class="btn">
                    Login
                </button>

            </form>

            <p>
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

            <p>
                <a href="index.html">
                    ← Back to Home
                </a>
            </p>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
