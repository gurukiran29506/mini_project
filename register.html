<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Installment Schedule Generator</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h2>Create Account</h2>

            <form id="registerForm">

                <!-- Full Name -->
                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >


                <!-- Email -->
                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- Password -->
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    minlength="6"
                    required
                >


                <!-- Confirm Password -->
                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >


                <!-- Register Button -->
                <button
                    type="submit"
                    class="btn">
                    Register
                </button>

            </form>


            <!-- Login Link -->

            <p>
                Already have an account?
                <a href="login.html">
                    Login
                </a>
            </p>


            <!-- Home Link -->

            <p>
                <a href="index.html">
                    ← Back to Home
                </a>
            </p>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
